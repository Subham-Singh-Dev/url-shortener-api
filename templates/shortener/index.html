<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftURL — URL Shortener</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --bg-1: #0b1020;
            --bg-2: #0f1a2b;
            --surface: rgba(20, 29, 48, 0.82);
            --surface-strong: rgba(16, 25, 42, 0.95);
            --border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent-1: #22d3ee;
            --accent-2: #f59e0b;
            --accent-3: #60a5fa;
            --glow: rgba(34, 211, 238, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at top, #172554 0%, var(--bg-1) 40%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 64px 20px 80px;
            overflow-x: hidden;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(0px);
            opacity: 0.75;
            animation: float 14s ease-in-out infinite;
        }

        .orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.3), transparent 70%);
            top: -120px;
            left: -140px;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.28), transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.25), transparent 70%);
            top: 30%;
            right: 12%;
            animation-delay: -7s;
        }

        .shell {
            width: 100%;
            max-width: 920px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            animation: fadeUp 0.8s ease both;
        }

        .hero {
            display: grid;
            gap: 10px;
            text-align: center;
        }

        .badge {
            align-self: center;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(34, 211, 238, 0.35);
            color: #a5f3fc;
            background: rgba(15, 23, 42, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.6rem, 5vw, 3.6rem);
            font-weight: 700;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 6px;
        }

        .tagline {
            color: var(--muted);
            font-size: 1.05rem;
        }

        .hero-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            color: #cbd5f5;
            font-size: 0.95rem;
        }

        .hero-row span {
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: clamp(24px, 4vw, 40px);
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(34, 211, 238, 0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .card:hover::after { opacity: 1; }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 0;
        }

        .input-wrap {
            flex: 1 1 260px;
            position: relative;
        }

        .input-wrap::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 14px;
            background: linear-gradient(120deg, rgba(34, 211, 238, 0.4), rgba(245, 158, 11, 0.25));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .input-wrap:focus-within::after { opacity: 1; }

        input[type="url"] {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 16px 18px;
            background: var(--surface-strong);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.98rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="url"]:focus {
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.16);
        }

        input[type="url"]::placeholder { color: #64748b; }

        button {
            padding: 16px 30px;
            background: linear-gradient(135deg, #22d3ee, #f59e0b);
            border: none;
            border-radius: 12px;
            color: #0b1020;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
            white-space: nowrap;
            box-shadow: 0 16px 30px rgba(34, 211, 238, 0.22);
        }

        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: rgba(8, 14, 26, 0.75);
            border: 1px solid rgba(34, 211, 238, 0.4);
            border-radius: 12px;
            animation: pop 0.4s ease;
        }

        .result.show { display: block; }

        .result-label {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
        }

        .short-url {
            font-size: 1.15rem;
            font-weight: 600;
            color: #7dd3fc;
            text-decoration: none;
            word-break: break-all;
        }

        .short-url:hover { text-decoration: underline; }

        .copy-btn {
            margin-top: 12px;
            padding: 10px 22px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #04111f;
            box-shadow: 0 12px 22px rgba(14, 165, 233, 0.25);
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .error-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(127, 29, 29, 0.3);
            border: 1px solid rgba(248, 113, 113, 0.6);
            border-radius: 10px;
            color: #fecaca;
            font-size: 0.9rem;
        }

        .error-msg.show { display: block; }

        .history-section h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            color: #e2e8f0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .history-item:last-child { border-bottom: none; }

        .history-original {
            font-size: 0.82rem;
            color: #cbd5f5;
            max-width: 380px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-short {
            font-size: 0.9rem;
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
        }

        .history-short:hover { text-decoration: underline; }

        .click-badge {
            font-size: 0.75rem;
            background: rgba(14, 116, 144, 0.4);
            color: #bae6fd;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 720px) {
            body { padding: 40px 16px 64px; }
            .card { padding: 24px; }
            .history-original { max-width: 240px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb, .shell, .result { animation: none; }
            button { transition: none; }
        }
    </style>
</head>
<body>
    <div class="backdrop">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <div class="shell">
        <header class="hero">
            <span class="badge">Rapid Shortening</span>
            <div class="logo">SwiftURL</div>
            <p class="tagline">Shorten links. Track clicks. Launch campaigns with clarity.</p>
            <div class="hero-row">
                <span>Realtime click tracking</span>
                <span>One-tap copy</span>
                <span>Clean analytics</span>
            </div>
        </header>

        <div class="card">
            <div class="input-group">
                <div class="input-wrap">
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="https://your-long-url.com/paste-here"
                        onkeydown="if(event.key==='Enter') shortenURL()"
                    />
                </div>
                <button onclick="shortenURL()" id="shortenBtn">
                    Shorten
                </button>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="result" id="result">
                <div class="result-label">Your Short URL</div>
                <a class="short-url" id="shortUrl" href="#" target="_blank"></a>
                <br>
                <button class="copy-btn" onclick="copyURL()">Copy Link</button>
                <div class="stats-row">
                    <span id="clickCount">0 clicks</span>
                    <span>•</span>
                    <span id="createdAt"></span>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <h3>Recent Links</h3>
            <div id="historyList">
                <p style="color: #94a3b8; font-size: 0.9rem;">
                    No links yet. Shorten your first URL above.
                </p>
            </div>
        </div>

        <p class="footer-note">Built with Django. Designed for fast link workflows.</p>
    </div>

    <script>
        const BASE = window.location.origin;
        let currentShortUrl = '';

        async function shortenURL() {
            const input = document.getElementById('urlInput');
            const url = input.value.trim();
            const btn = document.getElementById('shortenBtn');
            const errorMsg = document.getElementById('errorMsg');
            const result = document.getElementById('result');

            errorMsg.classList.remove('show');
            result.classList.remove('show');

            if (!url) {
                showError('Please enter a URL');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Shortening...';

            try {
                const response = await fetch(`${BASE}/api/shorten/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ original_url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || data.original_url?.[0] || 'Something went wrong');
                    return;
                }

                const shortUrl = `${BASE}/${data.short_code}`;
                currentShortUrl = shortUrl;

                document.getElementById('shortUrl').href = shortUrl;
                document.getElementById('shortUrl').textContent = shortUrl;
                document.getElementById('clickCount').textContent = `${data.click_count} clicks`;
                document.getElementById('createdAt').textContent = 
                    new Date(data.created_at).toLocaleDateString('en-IN');

                result.classList.add('show');
                input.value = '';
                loadHistory();

            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Shorten';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function copyURL() {
            navigator.clipboard.writeText(currentShortUrl).then(() => {
                const btn = event.target;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy Link', 2000);
            });
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${BASE}/api/urls/`);
                const data = await response.json();
                const list = document.getElementById('historyList');

                if (!data.urls || data.urls.length === 0) {
                    list.innerHTML = '<p style="color:#475569;font-size:0.9rem">No links yet.</p>';
                    return;
                }

                list.innerHTML = data.urls.slice(0, 8).map(url => `
                    <div class="history-item">
                        <div>
                            <div class="history-original">${url.original_url}</div>
                            <a class="history-short" href="${BASE}/${url.short_code}" target="_blank">
                                ${BASE}/${url.short_code}
                            </a>
                            <span class="click-badge">${url.click_count} clicks</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load history');
            }
        }

        // Load history on page open
        loadHistory();
    </script>
</body>
</html>
